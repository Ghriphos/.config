$mod = SUPER

monitor = eDP-1,1920x1080@144.00101,0x0,1.0

bindl = , switch:on:Lid Switch, exec, bash -c 'if hyprctl monitors | grep "^Monitor " | grep -v "eDP-1" >/dev/null; then hyprctl keyword monitor "eDP-1, disable"; fi'

bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"

# Customization
decoration {
  rounding = 12
}

animations {
  enabled = yes
  bezier = workspaceBezier, 0.4, 0.0, 0.2, 1.0

  animation = workspaces, 1, 3, workspaceBezier
}

# Keyboard
input {
  kb_layout = us,br
  kb_options = grp:win_space_toggle
}

# Noctalia
exec-once = noctalia --daemon

# Launcher
bind = SUPER, RETURN, exec, noctalia msg panel-toggle launcher
bind = SUPER SHIFT, RETURN, exec, alacritty --title nix-search -e ~/.local/bin/nix-search

# Terminal
bind = $mod, T, exec, alacritty

# Fechar janela
bind = $mod, Q, killactive

# Print
bind = SUPER SHIFT, S, exec, sh -c 'f=$(mktemp --suffix=.png); grim -g "$(slurp)" "$f" && satty --filename "$f" --output-filename "$f" && wl-copy < "$f"; rm -f "$f"'

# Window navigation
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod CTRL, LEFT, workspace, e-1
bind = $mod CTRL, RIGHT, workspace, e+1

# Move window into workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Move window
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
